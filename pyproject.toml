[project]
name = "product-inventory-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary,pool]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
product-inventory-cli = "product_inventory_cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
